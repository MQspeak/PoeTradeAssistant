<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POE2 套利工具</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #100b09;
        --bg-soft: #1b1310;
        --panel: rgba(28, 22, 18, 0.96);
        --panel-soft: rgba(40, 31, 24, 0.96);
        --line: rgba(185, 142, 79, 0.28);
        --line-strong: rgba(224, 173, 91, 0.42);
        --ink: #f0dfc1;
        --muted: #b39d7d;
        --good: #7fd48d;
        --bad: #e07e67;
        --warn: #f0c36b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top, rgba(215, 163, 77, 0.12), transparent 24%),
          linear-gradient(180deg, rgba(130, 37, 29, 0.18), transparent 240px),
          linear-gradient(145deg, var(--bg) 0%, #140f0d 46%, var(--bg-soft) 100%);
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app-shell {
        max-width: 1380px;
        margin: 0 auto;
        padding: 18px 14px 36px;
      }

      .hero-card,
      .panel,
      .summary-card {
        border-radius: 14px;
        border: 1px solid var(--line);
        background:
          radial-gradient(circle at top right, rgba(224, 173, 91, 0.08), transparent 24%),
          linear-gradient(180deg, var(--panel-soft), var(--panel));
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }

      .hero-card {
        padding: 18px 20px;
      }

      .game-switcher {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
        padding: 8px;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: rgba(11, 9, 8, 0.78);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.26);
      }

      .game-switch-button {
        min-width: 0;
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        background: rgba(16, 12, 10, 0.88);
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .game-switch-button.active {
        color: var(--ink);
        border-color: rgba(224, 173, 91, 0.72);
        background:
          linear-gradient(180deg, rgba(182, 69, 53, 0.96), rgba(106, 31, 24, 0.98)),
          radial-gradient(circle at top, rgba(224, 173, 91, 0.18), transparent 60%);
        box-shadow: inset 0 0 0 1px rgba(240, 207, 147, 0.12);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #d3ab67;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .hero-title {
        font-size: clamp(1.7rem, 3vw, 2.5rem);
      }

      .hero-copy {
        margin-top: 10px;
        color: var(--muted);
        line-height: 1.7;
        max-width: 920px;
      }

      .tab-bar {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .tab-button,
      .ghost-button,
      .danger-button,
      .primary-button {
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 10px 14px;
        background: rgba(16, 12, 10, 0.88);
        color: var(--ink);
        cursor: pointer;
      }

      .tab-button.active,
      .primary-button {
        background:
          linear-gradient(180deg, rgba(182, 69, 53, 0.96), rgba(106, 31, 24, 0.98)),
          radial-gradient(circle at top, rgba(224, 173, 91, 0.18), transparent 60%);
        border-color: rgba(224, 173, 91, 0.5);
      }

      .danger-button {
        color: var(--bad);
        border-color: rgba(224, 126, 103, 0.3);
      }

      .page {
        margin-top: 16px;
        display: grid;
        gap: 14px;
      }

      .panel {
        padding: 16px;
        min-width: 0;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .panel-copy {
        margin-top: 8px;
        color: var(--muted);
        line-height: 1.6;
      }

      .control-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      label {
        display: grid;
        gap: 6px;
      }

      .field-label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      input,
      select {
        width: 100%;
        min-width: 0;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(11, 9, 8, 0.9);
        color: var(--ink);
        padding: 10px 12px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .summary-card {
        padding: 14px;
        display: grid;
        gap: 8px;
      }

      .summary-card .label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .summary-card .value {
        font-size: 1.3rem;
        font-weight: 700;
      }

      .summary-card .hint {
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.88rem;
      }

      .summary-card.good {
        border-color: rgba(127, 212, 141, 0.4);
      }

      .summary-card.warn {
        border-color: rgba(240, 195, 107, 0.4);
      }

      .summary-card.bad {
        border-color: rgba(224, 126, 103, 0.4);
      }

      .empty-state {
        padding: 18px;
        border-radius: 12px;
        border: 1px dashed var(--line);
        color: var(--muted);
        line-height: 1.7;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 1020px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid rgba(224, 173, 91, 0.12);
        text-align: left;
        vertical-align: middle;
      }

      th {
        font-size: 0.8rem;
        color: #f0cf93;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      td .cell-stack {
        display: grid;
        gap: 6px;
      }

      .inline-input {
        min-width: 120px;
      }

      .target-name-input {
        min-width: 180px;
      }

      .roi-positive {
        color: var(--good);
        font-weight: 700;
      }

      .roi-negative {
        color: var(--bad);
        font-weight: 700;
      }

      .roi-neutral {
        color: var(--warn);
        font-weight: 700;
      }

      .hint-text {
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.88rem;
      }

      .action-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .drag-cell {
        width: 68px;
      }

      .drag-handle-button {
        width: 40px;
        min-width: 40px;
        padding: 8px 0;
        border-radius: 10px;
        border: 1px dashed var(--line-strong);
        background: rgba(11, 9, 8, 0.72);
        color: var(--muted);
        cursor: grab;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .drag-handle-button:active {
        cursor: grabbing;
      }

      .target-row.is-dragging {
        opacity: 0.45;
      }

      .target-row.is-drag-over-before td {
        border-top: 2px solid rgba(127, 212, 141, 0.9);
      }

      .target-row.is-drag-over-after td {
        border-bottom: 2px solid rgba(127, 212, 141, 0.9);
      }

      .formula-topbar {
        display: grid;
        grid-template-columns: minmax(220px, 280px) 1fr auto;
        gap: 18px;
        align-items: center;
      }

      .formula-workspace {
        display: grid;
        gap: 16px;
      }

      .formula-name-input {
        min-height: 56px;
        font-size: 1rem;
      }

      .formula-metrics {
        display: flex;
        gap: 24px;
        align-items: center;
        flex-wrap: wrap;
      }

      .formula-metric-inline {
        font-size: 1rem;
        color: var(--ink);
        white-space: nowrap;
      }

      .formula-metric-inline strong {
        font-size: 1.15rem;
      }

      .formula-zone {
        padding: 18px 20px 20px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(190, 190, 190, 0.12);
      }

      .formula-zone-title {
        margin: 0 0 14px;
        text-align: center;
        font-size: 1.1rem;
      }

      .formula-card-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: flex-start;
        align-items: stretch;
      }

      .formula-item-card {
        position: relative;
        width: 180px;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background:
          radial-gradient(circle at top right, rgba(224, 173, 91, 0.08), transparent 24%),
          linear-gradient(180deg, var(--panel-soft), var(--panel));
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
        display: grid;
        gap: 10px;
      }

      .formula-item-card input,
      .formula-item-card select {
        padding: 8px 10px;
        border-radius: 10px;
      }

      .formula-field-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 58px;
        gap: 4px;
      }

      .formula-inline-row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }

      .formula-compact-label {
        font-size: 0.78rem;
        color: var(--ink);
        line-height: 1.2;
      }

      .formula-inline-hint {
        font-size: 0.72rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .formula-add-tile {
        width: 180px;
        min-height: 222px;
        border: 2px dashed rgba(255, 125, 125, 0.7);
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(255, 125, 125, 0.08), rgba(255, 125, 125, 0.03)),
          rgba(11, 9, 8, 0.35);
        color: #ff7d7d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        line-height: 1;
      }

      .formula-add-tile:hover {
        background: rgba(255, 125, 125, 0.12);
      }

      .formula-card-delete {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }

      .formula-item-card:hover .formula-card-delete,
      .formula-item-card:focus-within .formula-card-delete {
        opacity: 1;
        pointer-events: auto;
      }

      .hidden,
      .page.hidden {
        display: none;
      }

      @media (max-width: 980px) {
        .summary-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .app-shell {
          padding: 12px 10px 24px;
        }

        .panel-head,
        .control-row,
        .action-row {
          align-items: stretch;
        }

        .tab-button,
        .ghost-button,
        .danger-button,
        .primary-button {
          width: 100%;
        }

        .formula-topbar {
          grid-template-columns: 1fr;
        }

        .formula-metrics {
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell"></div>

    <script>
      const LEGACY_STORAGE_KEY = "poe2-arbitrage-tool-standalone-v3";
      const STORAGE_KEY = "poe-arbitrage-tool-standalone-v4";
      const GAME_IDS = ["poe1", "poe2"];
      const SCANNER_CURRENCY_ALIASES = {
        "混沌石": "C",
        "神聖石": "D",
        "神圣石": "D",
        "崇高石": "E",
        "Chaos Orb": "C",
        "Divine Orb": "D",
        "Exalted Orb": "E",
        "C": "C",
        "D": "D",
        "E": "E"
      };

      function createId(prefix) {
        return prefix + "-" + Math.random().toString(36).slice(2, 10);
      }

      function parsePositiveNumber(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
      }

      function parseTradeValue(value, options = {}) {
        const text = String(value || "").trim();
        if (!text) {
          return null;
        }

        if (options.allowRatio && text.includes("/")) {
          const parts = text.split("/").map((part) => part.trim());
          if (parts.length !== 2) {
            return null;
          }

          const itemCount = Number(parts[0]);
          const currencyCount = Number(parts[1]);
          if (!Number.isFinite(itemCount) || !Number.isFinite(currencyCount) || itemCount <= 0 || currencyCount <= 0) {
            return null;
          }

          return currencyCount / itemCount;
        }

        return parsePositiveNumber(text);
      }

      function parseNonNegativeNumber(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) && parsed >= 0 ? parsed : null;
      }

      function formatNumber(value, digits = 4) {
        if (!Number.isFinite(value)) {
          return "--";
        }

        return new Intl.NumberFormat("zh-CN", {
          minimumFractionDigits: 0,
          maximumFractionDigits: digits
        }).format(value);
      }

      function formatPercent(value) {
        if (!Number.isFinite(value)) {
          return "--";
        }

        return (value > 0 ? "+" : "") + formatNumber(value, 2) + "%";
      }

      function formatGoldCompact(value) {
        if (!Number.isFinite(value)) {
          return "--";
        }

        if (Math.abs(value) >= 10000) {
          return formatNumber(value / 10000, 1) + "万";
        }

        return formatNumber(value, 2);
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function createEmptyItem() {
        return {
          id: createId("item"),
          name: "",
          category: "currency",
          goldCost: "0"
        };
      }

      function createEmptyTarget() {
        return {
          id: createId("target"),
          itemId: "",
          rates: {}
        };
      }

      function createEmptyPair() {
        return {
          id: createId("pair"),
          baseItemId: "",
          quoteItemId: "",
          rate: ""
        };
      }

      function createEmptyRuneTarget() {
        return {
          id: createId("rune"),
          runeName: "",
          smallPrice: "",
          smallCurrencyId: "",
          smallGoldCost: "",
          perfectPrice: "",
          perfectCurrencyId: ""
        };
      }

      function createEmptyFormulaEntry() {
        return {
          id: createId("formula-entry"),
          label: "",
          currencyId: "",
          unitPrice: "",
          goldCostPerUnit: "",
          quantity: "1"
        };
      }

      function createDefaultFormulaDraft() {
        return {
          editingFormulaId: "",
          name: "",
          costItems: [createEmptyFormulaEntry()],
          revenueItems: [createEmptyFormulaEntry()]
        };
      }

      function createDefaultFormulaArbitrageState() {
        return {
          draft: createDefaultFormulaDraft(),
          formulas: []
        };
      }

      function normalizeFormulaEntry(entry) {
        return {
          id: entry && entry.id ? entry.id : createId("formula-entry"),
          label: entry && typeof entry.label === "string" ? entry.label : "",
          currencyId: entry && typeof entry.currencyId === "string" ? entry.currencyId : "",
          unitPrice: entry && typeof entry.unitPrice === "string" ? entry.unitPrice : "",
          goldCostPerUnit: entry && typeof entry.goldCostPerUnit === "string" ? entry.goldCostPerUnit : "",
          quantity: entry && typeof entry.quantity === "string" ? entry.quantity : "1"
        };
      }

      function normalizeFormulaDraft(draft) {
        return {
          editingFormulaId: draft && typeof draft.editingFormulaId === "string" ? draft.editingFormulaId : "",
          name: draft && typeof draft.name === "string" ? draft.name : "",
          costItems: Array.isArray(draft && draft.costItems) && draft.costItems.length
            ? draft.costItems.map(normalizeFormulaEntry)
            : [createEmptyFormulaEntry()],
          revenueItems: Array.isArray(draft && draft.revenueItems) && draft.revenueItems.length
            ? draft.revenueItems.map(normalizeFormulaEntry)
            : [createEmptyFormulaEntry()]
        };
      }

      function normalizeFormulaRecord(formula) {
        return {
          id: formula && formula.id ? formula.id : createId("formula"),
          name: formula && typeof formula.name === "string" ? formula.name : "",
          costItems: Array.isArray(formula && formula.costItems) && formula.costItems.length
            ? formula.costItems.map(normalizeFormulaEntry)
            : [createEmptyFormulaEntry()],
          revenueItems: Array.isArray(formula && formula.revenueItems) && formula.revenueItems.length
            ? formula.revenueItems.map(normalizeFormulaEntry)
            : [createEmptyFormulaEntry()]
        };
      }

      function createDefaultRuneArbitrageState() {
        return {
          socket4Cost: "",
          socket4CurrencyId: "",
          socket4GoldCost: "",
          extractorCost: "",
          extractorCurrencyId: "",
          extractorGoldCost: "",
          smithCost: "",
          smithCurrencyId: "",
          smithGoldCost: "",
          runes: [createEmptyRuneTarget()]
        };
      }

      function getDefaultState() {
        return {
          activeTab: "items",
          showFormulaTab: false,
          selectedModeKey: "",
          items: [createEmptyItem()],
          targets: [createEmptyTarget()],
          pairs: [createEmptyPair()],
          runeArbitrage: createDefaultRuneArbitrageState(),
          formulaArbitrage: createDefaultFormulaArbitrageState()
        };
      }

      function normalizeGameState(saved) {
        if (!saved || typeof saved !== "object") {
          return getDefaultState();
        }

        const showFormulaTab = saved.showFormulaTab === true;
        const activeTab = ["items", "pairs", "targets", "runes", "formulas"].includes(saved.activeTab) ? saved.activeTab : "items";

        return {
            activeTab: !showFormulaTab && activeTab === "formulas" ? "items" : activeTab,
            showFormulaTab,
            selectedModeKey: typeof saved.selectedModeKey === "string" ? saved.selectedModeKey : "",
            items: Array.isArray(saved.items) && saved.items.length
              ? saved.items.map((item) => ({
                  id: item.id || createId("item"),
                  name: typeof item.name === "string" ? item.name : "",
                  category: item.category === "target" ? "target" : "currency",
                  goldCost: typeof item.goldCost === "string" ? item.goldCost : "0"
                }))
              : [createEmptyItem()],
            targets: Array.isArray(saved.targets) && saved.targets.length
              ? saved.targets.map((target) => ({
                  id: target.id || createId("target"),
                  itemId: typeof target.itemId === "string" ? target.itemId : "",
                  rates: target.rates && typeof target.rates === "object" ? target.rates : {}
                }))
              : [createEmptyTarget()],
            pairs: Array.isArray(saved.pairs) && saved.pairs.length
              ? saved.pairs.map((pair) => ({
                  id: pair.id || createId("pair"),
                  baseItemId: typeof pair.baseItemId === "string" ? pair.baseItemId : "",
                  quoteItemId: typeof pair.quoteItemId === "string" ? pair.quoteItemId : "",
                  rate: typeof pair.rate === "string" ? pair.rate : ""
                }))
              : [createEmptyPair()],
            runeArbitrage: saved.runeArbitrage && typeof saved.runeArbitrage === "object"
              ? {
                  socket4Cost: typeof saved.runeArbitrage.socket4Cost === "string" ? saved.runeArbitrage.socket4Cost : "",
                  socket4CurrencyId: typeof saved.runeArbitrage.socket4CurrencyId === "string" ? saved.runeArbitrage.socket4CurrencyId : "",
                  socket4GoldCost: typeof saved.runeArbitrage.socket4GoldCost === "string" ? saved.runeArbitrage.socket4GoldCost : "",
                  extractorCost: typeof saved.runeArbitrage.extractorCost === "string" ? saved.runeArbitrage.extractorCost : "",
                  extractorCurrencyId: typeof saved.runeArbitrage.extractorCurrencyId === "string" ? saved.runeArbitrage.extractorCurrencyId : "",
                  extractorGoldCost: typeof saved.runeArbitrage.extractorGoldCost === "string" ? saved.runeArbitrage.extractorGoldCost : "",
                  smithCost: typeof saved.runeArbitrage.smithCost === "string" ? saved.runeArbitrage.smithCost : "",
                  smithCurrencyId: typeof saved.runeArbitrage.smithCurrencyId === "string" ? saved.runeArbitrage.smithCurrencyId : "",
                  smithGoldCost: typeof saved.runeArbitrage.smithGoldCost === "string" ? saved.runeArbitrage.smithGoldCost : "",
                  runes: Array.isArray(saved.runeArbitrage.runes) && saved.runeArbitrage.runes.length
                    ? saved.runeArbitrage.runes.map((rune) => ({
                        id: rune.id || createId("rune"),
                        runeName: typeof rune.runeName === "string" ? rune.runeName : "",
                        smallPrice: typeof rune.smallPrice === "string" ? rune.smallPrice : "",
                        smallCurrencyId: typeof rune.smallCurrencyId === "string" ? rune.smallCurrencyId : "",
                        smallGoldCost: typeof rune.smallGoldCost === "string" ? rune.smallGoldCost : "",
                        perfectPrice: typeof rune.perfectPrice === "string" ? rune.perfectPrice : "",
                        perfectCurrencyId: typeof rune.perfectCurrencyId === "string" ? rune.perfectCurrencyId : ""
                      }))
                    : [createEmptyRuneTarget()]
                }
              : createDefaultRuneArbitrageState(),
            formulaArbitrage: saved.formulaArbitrage && typeof saved.formulaArbitrage === "object"
              ? {
                  draft: normalizeFormulaDraft(saved.formulaArbitrage.draft),
                  formulas: Array.isArray(saved.formulaArbitrage.formulas)
                    ? saved.formulaArbitrage.formulas.map(normalizeFormulaRecord)
                    : []
                }
              : createDefaultFormulaArbitrageState()
        };
      }

      function getDefaultApplicationState() {
        return {
          activeGame: "poe2",
          games: {
            poe1: getDefaultState(),
            poe2: getDefaultState()
          }
        };
      }

      function loadApplicationState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (saved && typeof saved === "object" && saved.games && typeof saved.games === "object") {
            return {
              activeGame: GAME_IDS.includes(saved.activeGame) ? saved.activeGame : "poe2",
              games: {
                poe1: normalizeGameState(saved.games.poe1),
                poe2: normalizeGameState(saved.games.poe2)
              }
            };
          }
        } catch {
          // Fall through to legacy migration and independent defaults.
        }

        let legacyPoe2 = null;
        try {
          legacyPoe2 = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || "null");
        } catch {
          legacyPoe2 = null;
        }

        const migratedState = {
          activeGame: "poe2",
          games: {
            poe1: getDefaultState(),
            poe2: normalizeGameState(legacyPoe2)
          }
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migratedState));
        return migratedState;
      }

      let applicationState = loadApplicationState();
      let state = applicationState.games[applicationState.activeGame];
      const app = document.getElementById("app");
      let isComposingText = false;
      let formulaRevealKeyBuffer = "";
      let draggingTargetId = "";
      let targetDropMarker = { id: "", placeAfter: false };

      function captureFocusState() {
        const active = document.activeElement;
        if (!active || !active.dataset) {
          return null;
        }

        return {
          action: active.dataset.action || "",
          id: active.dataset.id || "",
          field: active.dataset.field || "",
          currencyId: active.dataset.currencyId || "",
          game: active.dataset.game || "",
          value: typeof active.value === "string" ? active.value : "",
          selectionStart: typeof active.selectionStart === "number" ? active.selectionStart : null,
          selectionEnd: typeof active.selectionEnd === "number" ? active.selectionEnd : null
        };
      }

      function restoreFocusState(focusState) {
        if (!focusState || !focusState.action) {
          return;
        }

        const selectorParts = [`[data-action="${focusState.action}"]`];
        if (focusState.id) {
          selectorParts.push(`[data-id="${focusState.id}"]`);
        }
        if (focusState.field) {
          selectorParts.push(`[data-field="${focusState.field}"]`);
        }
        if (focusState.currencyId) {
          selectorParts.push(`[data-currency-id="${focusState.currencyId}"]`);
        }
        if (focusState.game) {
          selectorParts.push(`[data-game="${focusState.game}"]`);
        }

        const element = document.querySelector(selectorParts.join(""));
        if (!element || typeof element.focus !== "function") {
          return;
        }

        element.focus();
        if (typeof element.value === "string" && element.value !== focusState.value) {
          return;
        }

        if (typeof element.setSelectionRange === "function" && focusState.selectionStart !== null && focusState.selectionEnd !== null) {
          element.setSelectionRange(focusState.selectionStart, focusState.selectionEnd);
        }
      }

      function saveState() {
        applicationState.games[applicationState.activeGame] = state;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(applicationState));
      }

      function clearTargetDropClasses() {
        document.querySelectorAll(".target-row.is-drag-over-before, .target-row.is-drag-over-after").forEach((row) => {
          row.classList.remove("is-drag-over-before", "is-drag-over-after");
        });
      }

      function clearTargetDragState() {
        draggingTargetId = "";
        targetDropMarker = { id: "", placeAfter: false };
        clearTargetDropClasses();
        document.querySelectorAll(".target-row.is-dragging").forEach((row) => {
          row.classList.remove("is-dragging");
        });
      }

      function moveTargetRow(draggedId, targetId, placeAfter = false) {
        if (!draggedId || !targetId || draggedId === targetId) {
          clearTargetDragState();
          return;
        }

        const currentIndex = state.targets.findIndex((target) => target.id === draggedId);
        const targetIndex = state.targets.findIndex((target) => target.id === targetId);
        if (currentIndex === -1 || targetIndex === -1) {
          clearTargetDragState();
          return;
        }

        const nextTargets = [...state.targets];
        const [draggedTarget] = nextTargets.splice(currentIndex, 1);
        let insertIndex = nextTargets.findIndex((target) => target.id === targetId);
        if (insertIndex === -1) {
          clearTargetDragState();
          return;
        }

        if (placeAfter) {
          insertIndex += 1;
        }

        nextTargets.splice(insertIndex, 0, draggedTarget);
        state.targets = nextTargets;
        clearTargetDragState();
        saveState();
        render();
      }

      function switchGame(gameId) {
        if (!GAME_IDS.includes(gameId) || gameId === applicationState.activeGame) {
          return;
        }

        saveState();
        applicationState.activeGame = gameId;
        state = applicationState.games[gameId];
        saveState();
        render();
      }

      function getItemsByCategory(category) {
        return state.items.filter((item) => item.category === category);
      }

      function getItemById(id) {
        return state.items.find((item) => item.id === id) || null;
      }

      function getItemName(id) {
        const item = getItemById(id);
        return item && item.name ? item.name : "未命名物品";
      }

      function getItemGoldCost(id) {
        const item = getItemById(id);
        const parsed = parseNonNegativeNumber(item ? item.goldCost : "");
        return parsed === null ? 0 : parsed;
      }

      function normalizeItemLookupName(name) {
        return String(name || "").trim().toUpperCase();
      }

      function normalizeScannerCurrencyName(name) {
        const text = String(name || "").trim();
        if (!text) {
          return "";
        }

        return SCANNER_CURRENCY_ALIASES[text] || SCANNER_CURRENCY_ALIASES[text.toUpperCase()] || text;
      }

      function parseColonRatioToNumber(value) {
        const text = String(value || "").trim();
        if (!text) {
          return null;
        }

        const separator = text.includes(":") ? ":" : text.includes("：") ? "：" : text.includes("/") ? "/" : "";
        if (!separator) {
          return parsePositiveNumber(text);
        }

        const parts = text.split(separator).map((part) => part.trim());
        if (parts.length !== 2) {
          return null;
        }

        const left = Number(parts[0]);
        const right = Number(parts[1]);
        if (!Number.isFinite(left) || !Number.isFinite(right) || left <= 0 || right <= 0) {
          return null;
        }

        return right / left;
      }

      function parseImportedRatioParts(value) {
        const text = String(value || "").trim();
        if (!text) {
          return null;
        }

        const separator = text.includes(":") ? ":" : text.includes("：") ? "：" : text.includes("/") ? "/" : "";
        if (!separator) {
          const parsed = parsePositiveNumber(text);
          return parsed === null ? null : { left: formatImportedNumber(parsed), right: "1" };
        }

        const parts = text.split(separator).map((part) => part.trim());
        if (parts.length !== 2) {
          return null;
        }

        const left = Number(parts[0]);
        const right = Number(parts[1]);
        if (!Number.isFinite(left) || !Number.isFinite(right) || left <= 0 || right <= 0) {
          return null;
        }

        return {
          left: formatImportedNumber(left),
          right: formatImportedNumber(right)
        };
      }

      function formatImportedNumber(value) {
        if (!Number.isFinite(value)) {
          return "";
        }

        return String(Number(value.toFixed(8)));
      }

      function formatImportedBuyPriceValue(value) {
        const parts = parseImportedRatioParts(value);
        return parts ? formatImportedNumber(Number(parts.left) / Number(parts.right)) : "";
      }

      function formatImportedRatioText(value) {
        const parts = parseImportedRatioParts(value);
        return parts ? parts.left + "/" + parts.right : "";
      }

      function formatImportedSellRatioValue(value) {
        return formatImportedRatioText(value);
      }

      function ensureCurrencyItem(name) {
        const canonicalName = normalizeScannerCurrencyName(name);
        if (!canonicalName) {
          return null;
        }

        const existing = state.items.find((item) =>
          item.category === "currency" &&
          normalizeScannerCurrencyName(item.name) === canonicalName
        );
        if (existing) {
          return existing;
        }

        const reusable = state.items.find((item) => !String(item.name || "").trim());
        if (reusable) {
          reusable.name = canonicalName;
          reusable.category = "currency";
          reusable.goldCost = reusable.goldCost || "0";
          return reusable;
        }

        const item = createEmptyItem();
        item.name = canonicalName;
        item.category = "currency";
        state.items.push(item);
        return item;
      }

      function ensureTargetItem(name, goldCost) {
        const targetName = String(name || "").trim();
        if (!targetName) {
          return null;
        }

        const existing = state.items.find((item) =>
          item.category === "target" &&
          normalizeItemLookupName(item.name) === normalizeItemLookupName(targetName)
        );
        if (existing) {
          existing.goldCost = String(goldCost || existing.goldCost || "0");
          return existing;
        }

        const reusable = state.items.find((item) => !String(item.name || "").trim());
        const item = reusable || createEmptyItem();
        item.name = targetName;
        item.category = "target";
        item.goldCost = String(goldCost || "0");
        if (!reusable) {
          state.items.push(item);
        }
        return item;
      }

      function ensureCurrencyPair(baseCurrencyId, quoteCurrencyId, rate) {
        if (!baseCurrencyId || !quoteCurrencyId || !Number.isFinite(rate) || rate <= 0) {
          return null;
        }

        const direct = state.pairs.find((pair) => pair.baseItemId === baseCurrencyId && pair.quoteItemId === quoteCurrencyId);
        if (direct) {
          direct.rate = formatImportedNumber(rate);
          return direct;
        }

        const reverse = state.pairs.find((pair) => pair.baseItemId === quoteCurrencyId && pair.quoteItemId === baseCurrencyId);
        if (reverse) {
          reverse.rate = formatImportedNumber(1 / rate);
          return reverse;
        }

        const reusable = state.pairs.find((pair) => !pair.baseItemId && !pair.quoteItemId && !pair.rate);
        const pair = reusable || createEmptyPair();
        pair.baseItemId = baseCurrencyId;
        pair.quoteItemId = quoteCurrencyId;
        pair.rate = formatImportedNumber(rate);
        if (!reusable) {
          state.pairs.push(pair);
        }
        return pair;
      }

      function ensureTargetRowForItem(itemId) {
        const existing = state.targets.find((target) => target.itemId === itemId);
        if (existing) {
          return existing;
        }

        const reusable = state.targets.find((target) => !target.itemId);
        const target = reusable || createEmptyTarget();
        target.itemId = itemId;
        target.rates = target.rates && typeof target.rates === "object" ? target.rates : {};
        if (!reusable) {
          state.targets.push(target);
        }
        return target;
      }

      function formatPriceScanV2Ratio(ratio) {
        const raw = ratio && typeof ratio.raw === "string" ? ratio.raw.trim() : "";
        if (raw) {
          return raw;
        }

        const left = Number(ratio && ratio.left);
        const right = Number(ratio && ratio.right);
        if (!Number.isFinite(left) || !Number.isFinite(right) || left <= 0 || right <= 0) {
          return "";
        }

        return formatImportedNumber(left) + ":" + formatImportedNumber(right);
      }

      function normalizePriceScanV2Payload(payload) {
        if (!payload || payload.schemaVersion !== "poe-trade-scan/v2") {
          return payload;
        }

        const pair = payload.pair && typeof payload.pair === "object" ? payload.pair : {};
        const buyCurrency = String(pair.buyCurrency || "").trim();
        const sellCurrency = String(pair.sellCurrency || "").trim();
        const currentPairRatio = formatPriceScanV2Ratio(pair.currentRatio);
        if (!buyCurrency || !sellCurrency || !currentPairRatio) {
          throw new Error("V2 扫描结果缺少交易对或当前比例。");
        }

        const completedItems = Array.isArray(payload.items)
          ? payload.items.filter((item) => item && (item.status === "ok" || item.status === "imported-v1"))
          : [];

        return {
          "购买用通货": buyCurrency,
          "出售目标通货": sellCurrency,
          "当前交易对比例": currentPairRatio,
          "条目": completedItems.map((item) => ({
            "名字": String(item.name || "").trim(),
            "金币消耗": String(item.goldCost || ""),
            "买入比例": formatPriceScanV2Ratio(item.buyRatio),
            "卖出比例": formatPriceScanV2Ratio(item.sellRatio)
          }))
        };
      }

      function importPriceJson(payload) {
        payload = normalizePriceScanV2Payload(payload);
        if (!payload || typeof payload !== "object") {
          throw new Error("价格表格式不正确。");
        }

        const buyCurrency = ensureCurrencyItem(payload["购买用通货"]);
        const sellCurrency = ensureCurrencyItem(payload["出售目标通货"]);
        const pairRate = parseColonRatioToNumber(payload["当前交易对比例"]);
        const entries = Array.isArray(payload["条目"]) ? payload["条目"] : [];

        if (!buyCurrency || !sellCurrency || !pairRate) {
          throw new Error("价格表缺少购买用通货、出售目标通货或当前交易对比例。");
        }

        ensureCurrencyPair(sellCurrency.id, buyCurrency.id, pairRate);

        entries.forEach((entry) => {
          if (!entry || typeof entry !== "object") {
            return;
          }

          const targetItem = ensureTargetItem(entry["名字"], entry["金币消耗"]);
          if (!targetItem) {
            return;
          }

          const targetRow = ensureTargetRowForItem(targetItem.id);
          targetRow.rates = {
            ...targetRow.rates,
            [buyCurrency.id]: formatImportedBuyPriceValue(entry["买入比例"]),
            [sellCurrency.id]: formatImportedSellRatioValue(entry["卖出比例"])
          };
        });

        state.selectedModeKey = buyCurrency.id + "|" + sellCurrency.id;
        state.activeTab = "targets";
        saveState();
        render();
      }

      function handlePriceJsonFileImport(file) {
        if (!file) {
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          try {
            importPriceJson(JSON.parse(String(reader.result || "")));
          } catch (error) {
            alert(error && error.message ? error.message : "导入价格表失败，请检查 JSON 文件。");
          }
        };
        reader.onerror = () => {
          alert("读取价格表失败，请重新选择文件。");
        };
        reader.readAsText(file, "utf-8");
      }

      function renderSelectOptions(items, selectedId, placeholder) {
        const options = [`<option value="">${escapeHtml(placeholder)}</option>`];
        items.forEach((item) => {
          options.push(`<option value="${item.id}" ${item.id === selectedId ? "selected" : ""}>${escapeHtml(item.name || "未命名物品")}</option>`);
        });
        return options.join("");
      }

      function getValidPairs() {
        return state.pairs
          .map((pair) => {
            const baseItem = getItemById(pair.baseItemId);
            const quoteItem = getItemById(pair.quoteItemId);
            return {
              ...pair,
              baseItem,
              quoteItem,
              rateNumber: parsePositiveNumber(pair.rate)
            };
          })
          .filter((pair) =>
            pair.baseItem &&
            pair.quoteItem &&
            pair.baseItem.category === "currency" &&
            pair.quoteItem.category === "currency" &&
            pair.baseItem.id !== pair.quoteItem.id &&
            pair.rateNumber
          );
      }

      function getModeOptions() {
        const map = new Map();

        getValidPairs().forEach((pair) => {
          const buyQuoteMode = {
            key: pair.quoteItem.id + "|" + pair.baseItem.id,
            buyCurrencyId: pair.quoteItem.id,
            sellCurrencyId: pair.baseItem.id,
            buyCurrencyName: pair.quoteItem.name,
            sellCurrencyName: pair.baseItem.name,
            label: pair.quoteItem.name + "买" + pair.baseItem.name + "卖"
          };

          const buyBaseMode = {
            key: pair.baseItem.id + "|" + pair.quoteItem.id,
            buyCurrencyId: pair.baseItem.id,
            sellCurrencyId: pair.quoteItem.id,
            buyCurrencyName: pair.baseItem.name,
            sellCurrencyName: pair.quoteItem.name,
            label: pair.baseItem.name + "买" + pair.quoteItem.name + "卖"
          };

          map.set(buyQuoteMode.key, buyQuoteMode);
          map.set(buyBaseMode.key, buyBaseMode);
        });

        return Array.from(map.values());
      }

      function getSelectedMode() {
        const modes = getModeOptions();
        if (!modes.length) {
          return null;
        }

        const selected = modes.find((mode) => mode.key === state.selectedModeKey);
        if (selected) {
          return selected;
        }

        state.selectedModeKey = modes[0].key;
        saveState();
        return modes[0];
      }

      function getConversionRate(fromCurrencyId, toCurrencyId) {
        if (!fromCurrencyId || !toCurrencyId) {
          return null;
        }

        if (fromCurrencyId === toCurrencyId) {
          return 1;
        }

        const direct = getValidPairs().find((pair) => pair.baseItem.id === fromCurrencyId && pair.quoteItem.id === toCurrencyId);
        if (direct) {
          return direct.rateNumber;
        }

        const reverse = getValidPairs().find((pair) => pair.baseItem.id === toCurrencyId && pair.quoteItem.id === fromCurrencyId);
        if (reverse) {
          return 1 / reverse.rateNumber;
        }

        return null;
      }

      function convertPriceToCurrency(amountText, fromCurrencyId, toCurrencyId) {
        const amount = parsePositiveNumber(amountText);
        if (!amount) {
          return { status: "invalid-amount" };
        }

        if (!fromCurrencyId || !toCurrencyId) {
          return { status: "missing-currency" };
        }

        const rate = getConversionRate(fromCurrencyId, toCurrencyId);
        if (!rate) {
          return { status: "missing-rate" };
        }

        return {
          status: "ok",
          value: amount * rate,
          rate
        };
      }

      function convertTradeValueToCurrency(amountText, fromCurrencyId, toCurrencyId, options = {}) {
        const amount = parseTradeValue(amountText, options);
        if (!amount) {
          return { status: "invalid-amount" };
        }

        if (!fromCurrencyId || !toCurrencyId) {
          return { status: "missing-currency" };
        }

        const rate = getConversionRate(fromCurrencyId, toCurrencyId);
        if (!rate) {
          return { status: "missing-rate" };
        }

        return {
          status: "ok",
          value: amount * rate,
          rate,
          amount
        };
      }

      function calculateTargetArbitrage(targetRow, mode) {
        const targetItem = getItemById(targetRow.itemId);
        if (!mode) {
          return { status: "missing-mode", message: "请先配置基础交易对，生成套利模式。" };
        }

        if (!targetItem || targetItem.category !== "target") {
          return { status: "missing-target", message: "请先为这一行选择一个标的物。" };
        }

        const buyPrice = parseTradeValue(targetRow.rates[mode.buyCurrencyId]);
        const sellPrice = parseTradeValue(targetRow.rates[mode.sellCurrencyId], { allowRatio: true });

        if (!buyPrice || !sellPrice) {
          return { status: "incomplete", message: "补全当前标的在这两个货币下的价格后，才可计算 ROI 和金币消耗。" };
        }

        const sellToBuyRate = getConversionRate(mode.sellCurrencyId, mode.buyCurrencyId);
        if (!sellToBuyRate) {
          return { status: "missing-pair", message: "缺少 " + mode.sellCurrencyName + " -> " + mode.buyCurrencyName + " 的基础交易对汇率。" };
        }

        const revenueInBuyCurrency = sellPrice * sellToBuyRate;
        const netProfitInBuyCurrency = revenueInBuyCurrency - buyPrice;
        const netProfitInSellCurrency = netProfitInBuyCurrency / sellToBuyRate;
        const roi = (netProfitInBuyCurrency / buyPrice) * 100;

        const targetGoldCost = getItemGoldCost(targetItem.id);
        const sellCurrencyGoldCost = sellPrice * getItemGoldCost(mode.sellCurrencyId);
        const buyCurrencyGoldCost = buyPrice * getItemGoldCost(mode.buyCurrencyId);
        const totalGoldCost = targetGoldCost + sellCurrencyGoldCost + buyCurrencyGoldCost;
        const goldPerProfitSellCurrency = netProfitInSellCurrency > 0 ? totalGoldCost / netProfitInSellCurrency : null;

        const reverseRate = getConversionRate(mode.buyCurrencyId, mode.sellCurrencyId);
        let reverseRoi = null;
        if (reverseRate) {
          const reverseRevenue = buyPrice * reverseRate;
          reverseRoi = ((reverseRevenue - sellPrice) / sellPrice) * 100;
        }

        return {
          status: "ok",
          targetItem,
          buyPrice,
          sellPrice,
          roi,
          revenueInBuyCurrency,
          netProfitInBuyCurrency,
          netProfitInSellCurrency,
          totalGoldCost,
          goldPerProfitSellCurrency,
          goldBreakdown: {
            targetGoldCost,
            sellCurrencyGoldCost,
            buyCurrencyGoldCost
          },
          reverseRoi,
          reverseLabel: mode.sellCurrencyName + "买" + mode.buyCurrencyName + "卖"
        };
      }

      function setActiveTab(tab) {
        state.activeTab = tab;
        saveState();
        render();
      }
      function calculateRuneArbitrage(runeRow) {
        const runeName = String(runeRow.runeName || "").trim();
        const perfectPrice = parseTradeValue(runeRow.perfectPrice, { allowRatio: true });

        if (!runeName) {
          return { status: "incomplete", message: "请先填写符文类型名称。" };
        }

        if (!runeRow.perfectCurrencyId) {
          return { status: "incomplete", message: "请选择完美符文价格的币种。" };
        }

        if (!perfectPrice) {
          return { status: "incomplete", message: "请填写有效的完美符文价格。" };
        }

        const components = [
          { label: "4孔装备", amount: state.runeArbitrage.socket4Cost, currencyId: state.runeArbitrage.socket4CurrencyId, goldCost: state.runeArbitrage.socket4GoldCost, multiplier: 1, allowRatio: true },
          { label: "小符文", amount: runeRow.smallPrice, currencyId: runeRow.smallCurrencyId, goldCost: runeRow.smallGoldCost, multiplier: 4, allowRatio: true },
          { label: "锻匠", amount: state.runeArbitrage.smithCost, currencyId: state.runeArbitrage.smithCurrencyId, goldCost: state.runeArbitrage.smithGoldCost, multiplier: 4, allowRatio: true },
          { label: "萃取石", amount: state.runeArbitrage.extractorCost, currencyId: state.runeArbitrage.extractorCurrencyId, goldCost: state.runeArbitrage.extractorGoldCost, multiplier: 1, allowRatio: true }
        ];

        const breakdown = [];
        let totalCostInPerfectCurrency = 0;
        let totalGoldCost = 0;

        for (const component of components) {
          const converted = convertTradeValueToCurrency(component.amount, component.currencyId, runeRow.perfectCurrencyId, {
            allowRatio: component.allowRatio
          });

          if (converted.status === "invalid-amount") {
            return { status: "incomplete", message: `请填写有效的${component.label}价格。` };
          }

          if (converted.status === "missing-currency") {
            return { status: "incomplete", message: `请为${component.label}选择价格单位。` };
          }

          if (converted.status === "missing-rate") {
            return {
              status: "missing-rate",
              message: `缺少 ${getItemName(component.currencyId)} -> ${getItemName(runeRow.perfectCurrencyId)} 的基础交易对汇率。`
            };
          }

          const goldCost = parseNonNegativeNumber(component.goldCost);
          if (goldCost === null) {
            return { status: "incomplete", message: `请填写有效的${component.label}金币消耗。` };
          }

          const componentCurrencyGoldCost = getItemGoldCost(component.currencyId);
          const total = converted.value * component.multiplier;
          totalCostInPerfectCurrency += total;
          totalGoldCost += (goldCost + (componentCurrencyGoldCost * converted.amount)) * component.multiplier;
          breakdown.push({
            label: component.label,
            multiplier: component.multiplier,
            total,
            goldCost: (goldCost + (componentCurrencyGoldCost * converted.amount)) * component.multiplier
          });
        }

        const perfectGoldCost = getItemGoldCost(runeRow.perfectCurrencyId);

        const totalRevenueInPerfectCurrency = 4 * perfectPrice;
        const totalGoldRevenueCost = perfectGoldCost * totalRevenueInPerfectCurrency;
        const netProfitInPerfectCurrency = totalRevenueInPerfectCurrency - totalCostInPerfectCurrency;
        const dCurrency = getItemsByCategory("currency").find((item) => item.name.trim().toUpperCase() === "D") || null;
        let goldEfficiencyPerDivine = null;
        let goldEfficiencyMessage = "";

        if (!dCurrency) {
          goldEfficiencyMessage = "请先在物品列表中新增 D 币种，才能计算金币效率。";
          } else {
            const perfectToDRate = getConversionRate(runeRow.perfectCurrencyId, dCurrency.id);
            if (!perfectToDRate) {
              goldEfficiencyMessage = `当前币种缺少与 D 的基础交易对，请先构建交易对以便计算金币效率。`;
            } else {
            const netProfitInD = netProfitInPerfectCurrency * perfectToDRate;
            if (netProfitInD > 0) {
                goldEfficiencyPerDivine = (totalGoldCost + totalGoldRevenueCost) / netProfitInD;
            } else {
              goldEfficiencyMessage = "当前净收益不为正，无法计算每获得一个D需要消耗多少金币。";
            }
          }
          }

        return {
          status: "ok",
          runeName,
          perfectCurrencyName: getItemName(runeRow.perfectCurrencyId),
          perfectPrice,
          totalRevenueInPerfectCurrency,
          totalCostInPerfectCurrency,
          totalGoldCost,
          totalGoldRevenueCost,
          netProfitInPerfectCurrency,
          goldEfficiencyPerDivine,
          goldEfficiencyMessage,
          ratioPercent: (((4 * perfectPrice) / totalCostInPerfectCurrency) * 100) - 100,
          breakdown
        };
      }

      function calculateFormulaArbitrage(formula) {
        const name = String(formula.name || "").trim();
        const costItems = Array.isArray(formula.costItems) ? formula.costItems : [];
        const revenueItems = Array.isArray(formula.revenueItems) ? formula.revenueItems : [];
        const settlementCurrencyId = revenueItems[0].currencyId;

        if (!name) {
          return { status: "incomplete", message: "请先填写公式名称。" };
        }

        if (!revenueItems.length) {
          return { status: "incomplete", message: "请至少保留一条收益项。" };
        }

        if (!settlementCurrencyId) {
          return { status: "incomplete", message: "请先为第一条收益项选择币种，作为结算币种。" };
        }

        const settlementCurrencyName = getItemName(settlementCurrencyId);

        function normalizeFormulaEntries(entries, sideLabel) {
          const breakdown = [];

          for (const [index, entry] of entries.entries()) {
            const label = String(entry.label || "").trim();
            if (!label) {
              return { status: "incomplete", message: `请先填写第 ${index + 1} 条${sideLabel}的名称。` };
            }

            const quantity = parsePositiveNumber(entry.quantity);
            if (!quantity) {
              return { status: "incomplete", message: `请为${label}填写有效数量。` };
            }

            const goldCostPerUnit = sideLabel === "成本项" ? parseNonNegativeNumber(entry.goldCostPerUnit) : 0;
            if (sideLabel === "成本项" && goldCostPerUnit === null) {
              return { status: "incomplete", message: `请为${label}填写有效的单个金币消耗。` };
            }

            const converted = convertPriceToCurrency(entry.unitPrice, entry.currencyId, settlementCurrencyId);
            if (converted.status === "invalid-amount") {
              return { status: "incomplete", message: `请为${label}填写有效单价。` };
            }

            if (converted.status === "missing-currency") {
              return { status: "incomplete", message: `请为${label}选择币种。` };
            }

            if (converted.status === "missing-rate") {
              return {
                status: "missing-rate",
                message: `缺少 ${getItemName(entry.currencyId)} -> ${settlementCurrencyName} 的基础交易对，请先去基础交易对列表构建交易对。`
              };
            }

            const unitPrice = parsePositiveNumber(entry.unitPrice);
            const currencyGoldCostPerUnit = getItemGoldCost(entry.currencyId);
            const totalValueInSettlementCurrency = converted.value * quantity;
            const totalGoldCost = (goldCostPerUnit + (currencyGoldCostPerUnit * unitPrice)) * quantity;
            breakdown.push({
              id: entry.id,
              label,
              currencyId: entry.currencyId,
              currencyName: getItemName(entry.currencyId),
              unitPrice,
              quantity,
              totalValueInSettlementCurrency,
              totalGoldCost,
              manualGoldCostPerUnit: goldCostPerUnit,
              currencyGoldCostPerUnit
            });
          }

          return { status: "ok", breakdown };
        }

        const costResult = normalizeFormulaEntries(costItems, "成本项");
        if (costResult.status !== "ok") {
          return costResult;
        }

        const revenueResult = normalizeFormulaEntries(revenueItems, "收益项");
        if (revenueResult.status !== "ok") {
          return revenueResult;
        }

        const costBreakdown = costResult.breakdown;
        const revenueBreakdown = revenueResult.breakdown;
        const totalCostInSettlementCurrency = costBreakdown.reduce((sum, item) => sum + item.totalValueInSettlementCurrency, 0);
        const totalRevenueInSettlementCurrency = revenueBreakdown.reduce((sum, item) => sum + item.totalValueInSettlementCurrency, 0);

        if (totalCostInSettlementCurrency <= 0) {
          return { status: "incomplete", message: "总成本必须大于 0，才能计算收益率。" };
        }

        const netProfitInSettlementCurrency = totalRevenueInSettlementCurrency - totalCostInSettlementCurrency;
        const roiPercent = ((totalRevenueInSettlementCurrency / totalCostInSettlementCurrency) * 100) - 100;
        const totalGoldCost = costBreakdown.reduce((sum, item) => sum + item.totalGoldCost, 0) + revenueBreakdown.reduce((sum, item) => sum + item.totalGoldCost, 0);

        const dCurrency = getItemsByCategory("currency").find((item) => item.name.trim().toUpperCase() === "D") || null;
        let goldEfficiencyPerDivine = null;
        let goldEfficiencyMessage = "";

        if (!dCurrency) {
          goldEfficiencyMessage = "请先在物品列表中新增 D 币种，才能计算金币效率。";
        } else {
          const settlementToDRate = getConversionRate(settlementCurrencyId, dCurrency.id);
          if (!settlementToDRate) {
            goldEfficiencyMessage = "当前结算币种缺少与 D 的基础交易对，请先去基础交易对列表构建交易对。";
          } else {
            const netProfitInD = netProfitInSettlementCurrency * settlementToDRate;
            if (netProfitInD > 0) {
              goldEfficiencyPerDivine = totalGoldCost / netProfitInD;
            } else {
              goldEfficiencyMessage = "当前纯利润不为正，无法计算每获得 1 个D需要消耗多少金币。";
            }
          }
        }

        return {
          status: "ok",
          name,
          settlementCurrencyId,
          settlementCurrencyName,
          costBreakdown,
          revenueBreakdown,
          totalCostInSettlementCurrency,
          totalRevenueInSettlementCurrency,
          netProfitInSettlementCurrency,
          roiPercent,
          totalGoldCost,
          goldEfficiencyPerDivine,
          goldEfficiencyMessage
        };
      }

        const entries = state.formulaArbitrage.draft[field];

          return;

        const field = type === "cost" ? "costItems" : "revenueItems";
        const entries = state.formulaArbitrage.draft[field];
        const nextEntries = entries.filter((entry) => entry.id !== id);
        state.formulaArbitrage = {
          ...state.formulaArbitrage,
          draft: {
            ...state.formulaArbitrage.draft,
            [field]: nextEntries.length ? nextEntries : [createEmptyFormulaEntry()]
          }
        };
        saveState();

      }

          draft: {
            ...state.formulaArbitrage.draft,
            [field]: value
          }
        };
        saveState();
        render();
      }

      function updateFormulaEntryField(type, id, field, value) {
        const listField = type === "cost" ? "costItems" : "revenueItems";
        state.formulaArbitrage = {
          ...state.formulaArbitrage,
          draft: {
            ...state.formulaArbitrage.draft,
            [listField]: state.formulaArbitrage.draft[listField].map((entry) => (
              entry.id === id ? { ...entry, [field]: value } : entry
            ))
          }
        };
        saveState();
        render();
      }

      function saveFormulaDraft() {
        const draft = normalizeFormulaDraft(state.formulaArbitrage.draft);
        const formulaId = draft.editingFormulaId || createId("formula");
        const record = {
          id: formulaId,
          name: draft.name,
          costItems: draft.costItems.map(normalizeFormulaEntry),
          revenueItems: draft.revenueItems.map(normalizeFormulaEntry)
        };

        const exists = state.formulaArbitrage.formulas.some((formula) => formula.id === formulaId);
        state.formulaArbitrage = {
          ...state.formulaArbitrage,
          draft: {
            ...draft,
            editingFormulaId: formulaId
          },
          formulas: exists
            ? state.formulaArbitrage.formulas.map((formula) => (formula.id === formulaId ? record : formula))
            : [...state.formulaArbitrage.formulas, record]
        };
        saveState();
        render();
      }

      function loadFormulaDraft(id) {
        const formula = state.formulaArbitrage.formulas.find((item) => item.id === id);
        if (!formula) {
          return;
        }

        state.formulaArbitrage = {
          ...state.formulaArbitrage,
          draft: {
            editingFormulaId: formula.id,
            name: formula.name,
            costItems: formula.costItems.map(normalizeFormulaEntry),

          }

        state.items = state.items.map((item) => (

        return `

            <input data-action="formula-entry-field" data-type="${type}" data-id="${entry.id}" data-field="label" value="${escapeHtml(entry.label)}" placeholder="${type === "cost" ? "输入材料名称" : "输入产物名称"}" />

            ` : `
              <div class="formula-inline-hint">该币种出售金币消耗自动读取物品列表</div>
            `}
            <div class="formula-inline-row">
              <span class="formula-compact-label">数量</span>
              <input data-action="formula-entry-field" data-type="${type}" data-id="${entry.id}" data-field="quantity" value="${escapeHtml(entry.quantity)}" placeholder="数量" />
            </div>
          </article>

        return `

                <button class="primary-button" data-action="save-formula">保存公式</button>

                      <th>公式名</th>
                      <th>收益率</th>
                      <th>纯利润</th>
                      <th>金币兑换效率</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>${savedRows}</tbody>
                </table>
              </div>
            </section>
          </section>
        `;
      }

            <p class="eyebrow">${currentGameLabel} Local Tool · 当前游戏</p>
            <h1 class="hero-title">${currentGameLabel} 本地套利工具</h1>
            <p class="hero-copy">当前工具分成 5 个分页：物品列表、套利基础交易对列表、套利标的列表、符文套利，以及新增的公式套利分页。</p>
          </section>

          <nav class="tab-bar">
            <button class="tab-button ${state.activeTab === "items" ? "active" : ""}" data-action="switch-tab" data-tab="items">物品列表</button>
            <button class="tab-button ${state.activeTab === "pairs" ? "active" : ""}" data-action="switch-tab" data-tab="pairs">套利基础交易对列表</button>
            <button class="tab-button ${state.activeTab === "targets" ? "active" : ""}" data-action="switch-tab" data-tab="targets">套利标的列表</button>
            <button class="tab-button ${state.activeTab === "runes" ? "active" : ""}" data-action="switch-tab" data-tab="runes">符文套利</button>
            ${state.showFormulaTab ? `<button class="tab-button ${state.activeTab === "formulas" ? "active" : ""}" data-action="switch-tab" data-tab="formulas">公式套利</button>` : ""}
          </nav>

          <div class="${state.activeTab === "items" ? "" : "hidden"}">${itemsPage}</div>
          <div class="${state.activeTab === "pairs" ? "" : "hidden"}">${pairsPage}</div>
          <div class="${state.activeTab === "targets" ? "" : "hidden"}">${targetsPage}</div>
          <div class="${state.activeTab === "runes" ? "" : "hidden"}">${runesPage}</div>
          <div class="${state.activeTab === "formulas" ? "" : "hidden"}">${formulasPage}</div>
        `;

        restoreFocusState(focusState);
      }
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) {
          return;
        }

        const action = target.dataset.action;

        if (action === "switch-game") {
          switchGame(target.dataset.game);
          return;
        }

        if (action === "switch-tab") {
          setActiveTab(target.dataset.tab);
          return;
        }

        if (action === "add-item") {
          addItem();
          return;
        }

        if (action === "delete-item") {
          removeItem(target.dataset.id);
          return;
        }

        if (action === "add-pair") {
          addPair();
          return;
        }

        if (action === "delete-pair") {
          removePair(target.dataset.id);
          return;
        }

        if (action === "add-target") {
          addTarget();
          return;
        }

        if (action === "import-price-json") {
          const input = document.getElementById("price-json-import");
          if (input) {
            input.value = "";
            input.click();
          }
          return;
        }

        if (action === "delete-target") {
          removeTarget(target.dataset.id);
          return;
        }

        if (action === "add-rune") {
          addRuneTarget();
          return;
        }

        if (action === "delete-rune") {
          removeRuneTarget(target.dataset.id);
          return;
        }

        if (action === "add-formula-cost") {
          addFormulaEntry("cost");
          return;
        }

        if (action === "add-formula-revenue") {
          addFormulaEntry("revenue");
          return;
        }

        if (action === "delete-formula-entry") {
          removeFormulaEntry(target.dataset.type, target.dataset.id);
          return;
        }

        if (action === "save-formula") {
          saveFormulaDraft();
          return;
        }

        if (action === "edit-formula") {
          loadFormulaDraft(target.dataset.id);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (isComposingText || event.ctrlKey || event.metaKey || event.altKey) {
          return;
        }

        const key = String(event.key || "").toLowerCase();
        if (key.length !== 1) {
          return;
        }

        formulaRevealKeyBuffer = (formulaRevealKeyBuffer + key).slice(-3);
        if (formulaRevealKeyBuffer === "ppp") {
          formulaRevealKeyBuffer = "";
          if (!state.showFormulaTab) {
            state.showFormulaTab = true;
            saveState();
            render();
          }
          return;
        }

        if (formulaRevealKeyBuffer === "ooo") {
          formulaRevealKeyBuffer = "";
          if (state.showFormulaTab) {
            state.showFormulaTab = false;
            if (state.activeTab === "formulas") {
              state.activeTab = "items";
            }
            saveState();
            render();
          }
        }
      });

      document.addEventListener("input", (event) => {
        const target = event.target;
        const action = target.dataset.action;

        if (action === "item-field" && target.dataset.field !== "category") {
          updateItemField(target.dataset.id, target.dataset.field, target.value, false);
          return;
        }

        if (action === "pair-field" && target.dataset.field === "rate") {
          updatePairField(target.dataset.id, target.dataset.field, target.value);
          return;
        }

        if (action === "target-rate") {
          updateTargetRate(target.dataset.id, target.dataset.currencyId, target.value);
          return;
        }

        if (action === "rune-global-field") {
          updateRuneGlobalField(target.dataset.field, target.value);
          return;
        }

        if (action === "rune-field") {
          updateRuneField(target.dataset.id, target.dataset.field, target.value);
          return;
        }

        if (action === "formula-draft-field") {
          updateFormulaDraftField(target.dataset.field, target.value);
          return;
        }

        if (action === "formula-entry-field") {
          updateFormulaEntryField(target.dataset.type, target.dataset.id, target.dataset.field, target.value);
        }
      });

      document.addEventListener("change", (event) => {
        const target = event.target;
        const action = target.dataset.action;

        if (target.id === "price-json-import") {
          handlePriceJsonFileImport(target.files && target.files[0]);
          return;
        }

        if (target.id === "mode-select") {
          state.selectedModeKey = target.value;
          saveState();
          render();
          return;
        }

        if (action === "item-field" && target.dataset.field === "category") {
          updateItemField(target.dataset.id, target.dataset.field, target.value);
          return;
        }

        if (action === "item-field" && target.dataset.field !== "category") {
          updateItemField(target.dataset.id, target.dataset.field, target.value);
          return;
        }

        if (action === "pair-field" && (target.dataset.field === "baseItemId" || target.dataset.field === "quoteItemId")) {
          updatePairField(target.dataset.id, target.dataset.field, target.value);
          return;
        }

        if (action === "target-field" && target.dataset.field === "itemId") {
          updateTargetField(target.dataset.id, target.dataset.field, target.value);
          return;
        }

        if (action === "rune-global-field") {
          updateRuneGlobalField(target.dataset.field, target.value);
          return;
        }

        if (action === "rune-field") {
          updateRuneField(target.dataset.id, target.dataset.field, target.value);
          return;
        }

        if (action === "formula-draft-field") {
          updateFormulaDraftField(target.dataset.field, target.value);
          return;
        }

        if (action === "formula-entry-field") {
          updateFormulaEntryField(target.dataset.type, target.dataset.id, target.dataset.field, target.value);
        }
      });

      document.addEventListener("compositionstart", (event) => {
        const target = event.target;
        if (target && target.dataset && target.dataset.action === "item-field" && target.dataset.field === "name") {
          isComposingText = true;
        }
      });

      document.addEventListener("dragstart", (event) => {
        const handle = event.target.closest('[data-action="drag-target"]');
        if (!handle) {
          return;
        }

        draggingTargetId = handle.dataset.id || "";
        targetDropMarker = { id: "", placeAfter: false };

        const row = handle.closest("[data-target-row-id]");
        if (row) {
          row.classList.add("is-dragging");
        }

        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggingTargetId);
        }
      });

      document.addEventListener("dragover", (event) => {
        if (!draggingTargetId) {
          return;
        }

        const row = event.target.closest("[data-target-row-id]");
        if (!row) {
          return;
        }

        const rowId = row.dataset.targetRowId || "";
        if (!rowId || rowId === draggingTargetId) {
          clearTargetDropClasses();
          return;
        }

        event.preventDefault();
        const rect = row.getBoundingClientRect();
        const placeAfter = event.clientY > rect.top + rect.height / 2;
        targetDropMarker = { id: rowId, placeAfter };
        clearTargetDropClasses();
        row.classList.add(placeAfter ? "is-drag-over-after" : "is-drag-over-before");
      });

      document.addEventListener("drop", (event) => {
        if (!draggingTargetId) {
          return;
        }

        const row = event.target.closest("[data-target-row-id]");
        if (!row) {
          clearTargetDragState();
          return;
        }

        event.preventDefault();
        const targetId = row.dataset.targetRowId || targetDropMarker.id;
        const placeAfter = targetDropMarker.id === targetId ? targetDropMarker.placeAfter : false;
        moveTargetRow(draggingTargetId, targetId, placeAfter);
      });

      document.addEventListener("dragend", () => {
        clearTargetDragState();
      });

      document.addEventListener("compositionend", (event) => {
        const target = event.target;
        if (target && target.dataset && target.dataset.action === "item-field" && target.dataset.field === "name") {
          isComposingText = false;
          updateItemField(target.dataset.id, target.dataset.field, target.value);
        }
      });

      document.addEventListener("blur", (event) => {
        const target = event.target;
        if (
          target &&
          target.dataset &&
          target.dataset.action === "item-field" &&
          target.dataset.field !== "category" &&
          !isComposingText
        ) {
          updateItemField(target.dataset.id, target.dataset.field, target.value);
        }
      }, true);

      render();
    </script>
  </body>
</html>
